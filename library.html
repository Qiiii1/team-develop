::view-transition-new(project-sidebar){animation:none;opacity:1}

 function renderHistory(){const query=document.getElementById('history-query').value.trim().toLocaleLowerCase(),member=document.getElementById('history-member').value,date=document.getElementById('history-date').value;let rows=conversations.filter(c=>(!query||c.join(' ').toLocaleLowerCase().includes(query))&&(!member||c[1]===member)&&(!date||c[2].startsWith(date)));if(ascending)rows=[...rows].reverse();const list=document.getElementById('history-rows');list.querySelectorAll('[data-icon-width]').forEach(n=>iconObserver.unobserve(n));list.replaceChildren();document.getElementById('history-count').textContent='全部文件：'+rows.length;for(const row of rows){const button=el('button','history-row');button.innerHTML=iconMarkup.folder;row.forEach((value,i)=>button.append(el('span',i===0?'conversation-title':'',value)));button.addEventListener('click',()=>{previewTitle.textContent=row[0];previewBody.replaceChildren();addDetails([['成员',row[1]],['时间',row[2]],['标签',row[3]]]);showDialog(previewDialog,button);});list.append(button);}if(!rows.length)list.append(el('p','empty-results','没有找到匹配的对话'));hydrateIcons(list);}
 for(const id of ['history-query','history-member','history-date'])document.getElementById(id).addEventListener(id==='history-query'?'input':'change',renderHistory);
 document.getElementById('reset-history').addEventListener('click',()=>{for(const id of ['history-query','history-member','history-date'])document.getElementById(id).value='';ascending=false;document.getElementById('sort-time').setAttribute('aria-label','时间，降序');renderHistory();});
 document.getElementById('sort-time').addEventListener('click',()=>{ascending=!ascending;document.getElementById('sort-time').setAttribute('aria-label','时间，'+(ascending?'升序':'降序'));renderHistory();});
 function setView(){const history=location.hash==='#history';document.getElementById('history-view').hidden=!history;document.getElementById('stage-view').hidden=history;if(history)renderHistory();}
 document.getElementById('history-library').addEventListener('click',()=>location.hash='history');document.getElementById('back-stages').addEventListener('click',()=>{const url=new URL(location.href);url.hash='';history.pushState(null,'',url);setView();document.getElementById('history-library').focus();});window.addEventListener('hashchange',setView);window.addEventListener('popstate',setView);
 function navigate(file,hash=''){const url=new URL(file,location.href);url.searchParams.set('project',project.id);url.hash=hash;smoothNavigate(url);}

 let pageNavigating=false;
 function smoothNavigate(url){
  const target=new URL(url,location.href);
  if(target.href===location.href||pageNavigating)return;
  pageNavigating=true;
  window.appNavigate?window.appNavigate(target.href):location.assign(target.href);
 }
 window.addEventListener('pageshow',()=>{pageNavigating=false;});
 const homeUrl=new URL('project.html',location.href);homeUrl.searchParams.set('project',project.id);
 const brandLink=document.querySelector('.brand-link');brandLink.href=homeUrl.href;brandLink.setAttribute('aria-label','返回首页');brandLink.title='首页';
 brandLink.addEventListener('click',event=>{if(event.button!==0||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();smoothNavigate(homeUrl);});
 document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{const section=button.dataset.section;if(section==='workspace'){document.dispatchEvent(new CustomEvent('ok-ah:project-section',{detail:{projectId:project.id,section}}));}else if(section==='blackboard')document.dispatchEvent(new CustomEvent('ok-ah:project-section',{detail:{projectId:project.id,section}}));else if(section==='library'){if(location.hash){history.pushState(null,'',location.pathname+location.search);setView();}}else document.dispatchEvent(new CustomEvent('ok-ah:project-section',{detail:{projectId:project.id,section}}));}));
 const raise=document.getElementById('raise-hand'),raiseKey='ok-ah.raised.'+project.id;function renderRaise(){let active=false;try{active=sessionStorage.getItem(raiseKey)==='true';}catch{}raise.setAttribute('aria-pressed',String(active));raise.textContent=active?'取消举手':'+ 举手';}renderRaise();raise.addEventListener('click',()=>{const active=raise.getAttribute('aria-pressed')!=='true';try{sessionStorage.setItem(raiseKey,String(active));}catch{}renderRaise();document.dispatchEvent(new CustomEvent('ok-ah:raise-hand',{detail:{projectId:project.id,raised:active}}));});

 const inviteTrigger=document.getElementById('invite'),inviteDialog=document.getElementById('invite-dialog'),inviteInput=document.getElementById('invite-link'),inviteCopy=document.getElementById('copy-invite-link'),inviteStatus=document.getElementById('invite-status');
 let inviteCloseTimer=null,inviteCopyTimer=null;
 function closeInvite(){
  if(!inviteDialog.open||inviteDialog.classList.contains('is-closing'))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){inviteDialog.close();return;}
  inviteDialog.classList.add('is-closing');inviteCloseTimer=setTimeout(()=>{inviteDialog.close();inviteDialog.classList.remove('is-closing');},180);
 }
 inviteTrigger.addEventListener('click',()=>{
  clearTimeout(inviteCloseTimer);clearTimeout(inviteCopyTimer);inviteDialog.classList.remove('is-closing');
  const url=new URL('project.html',location.href);url.searchParams.set('project',project.id);inviteInput.value=url.href;
  inviteCopy.textContent='复制链接';inviteStatus.textContent='';inviteDialog.showModal();requestAnimationFrame(()=>inviteInput.focus({preventScroll:true}));
 });
 inviteInput.addEventListener('click',()=>inviteInput.select());
 inviteCopy.addEventListener('click',async()=>{
  let copied=false;try{await navigator.clipboard.writeText(inviteInput.value);copied=true;}catch{inviteInput.focus();inviteInput.select();try{copied=document.execCommand('copy');}catch{}}
  if(copied){inviteCopy.textContent='已复制';inviteStatus.textContent='邀请链接已复制';clearTimeout(inviteCopyTimer);inviteCopyTimer=setTimeout(()=>inviteCopy.textContent='复制链接',1600);}
  else{inviteInput.focus();inviteInput.select();inviteStatus.textContent='请选择邀请链接后复制';}
 });
 inviteDialog.querySelectorAll('[data-invite-close]').forEach(button=>button.addEventListener('click',closeInvite));
 inviteDialog.addEventListener('cancel',event=>{event.preventDefault();closeInvite();});
 inviteDialog.addEventListener('click',event=>{if(event.target!==inviteDialog)return;const r=inviteDialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeInvite();});
 inviteDialog.addEventListener('close',()=>{clearTimeout(inviteCloseTimer);clearTimeout(inviteCopyTimer);inviteDialog.classList.remove('is-closing');inviteTrigger.focus({preventScroll:true});});

 renderStages();setView();
})();
</script><script>(()=>{const profile=document.querySelector('.profile');if(!profile)return;profile.setAttribute('role','link');profile.setAttribute('tabindex','0');profile.setAttribute('aria-label','账户设置');profile.style.cursor='pointer';const open=()=>{const query=new URLSearchParams(location.search);query.set('project',query.get('project')||localStorage.getItem('ok-ah.current-project.v1')||'team-management');query.set('from',location.pathname.includes('library')?'library':'project');window.appNavigate?window.appNavigate('account.html?'+query):location.assign('account.html?'+query);};profile.addEventListener('click',open);profile.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();open();}});try{const data=JSON.parse(localStorage.getItem('ok-ah.account.v1')||'{}');if(data.name)profile.querySelector('strong').textContent=data.name;}catch{}})();</script><script data-account-avatars>(()=>{
 const characters=[{"id": "ip-1", "src": "assets/media/a70f0f8e7edc213d5193.png", "label": "魔法帽"}, {"id": "ip-2", "src": "assets/media/eb17002bd6f9294f6f2d.png", "label": "电脑"}, {"id": "ip-3", "src": "assets/media/d1124d85e5834a0dcd1a.png", "label": "喇叭"}, {"id": "ip-4", "src": "assets/media/6ac396af9fb965bbabca.png", "label": "资料夹"}, {"id": "ip-5", "src": "assets/media/8ef2961c9f4238bc6f15.png", "label": "玫瑰"}, {"id": "ip-6", "src": "assets/media/4b837f9b34f20f5ea341.png", "label": "睡觉"}, {"id": "ip-7", "src": "assets/media/2bea2f7ca7ddf36a08a1.png", "label": "灵感灯泡"}, {"id": "ip-8", "src": "assets/media/0116221451688d4a7dce.png", "label": "牛仔帽"}, {"id": "ip-9", "src": "assets/media/555f2985b503c93c9927.png", "label": "出发"}],key='ok-ah.account.v1';
 const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
 function renderAvatar(){const data=read(),character=characters.find(item=>item.id===data.avatarId);document.querySelectorAll('.profile-placeholder').forEach(slot=>{slot.replaceChildren();slot.classList.toggle('has-ip-avatar',!!character);if(character){const img=document.createElement('img');img.src=character.src;img.alt=data.name?data.name+'的头像':'用户头像';slot.append(img);}});if(data.name)document.querySelectorAll('.profile strong').forEach(name=>name.textContent=data.name);}
 renderAvatar();addEventListener('pageshow',renderAvatar);addEventListener('storage',e=>{if(e.key===key)renderAvatar();});
 const picker=document.querySelector('.character-picker');if(!picker)return;
 let index=Math.max(0,characters.findIndex(item=>item.id===read().avatarId));
 const preview=picker.querySelector('.account-character'),arrows=picker.querySelectorAll('.character-arrow');
 function showCharacter(){preview.src=characters[index].src;preview.alt=characters[index].label+' IP人物形象';picker.setAttribute('aria-label','人物形象：'+characters[index].label);}
 arrows.forEach((arrow,i)=>{arrow.disabled=false;arrow.addEventListener('click',()=>{index=(index+(i===0?-1:1)+characters.length)%characters.length;showCharacter();});});
 showCharacter();document.getElementById('account-form').addEventListener('submit',()=>{try{const data=read();data.avatarId=characters[index].id;localStorage.setItem(key,JSON.stringify(data));renderAvatar();}catch{document.querySelector('.save-status').textContent='保存失败，请检查浏览器存储空间';}});
})();</script></body></html>
