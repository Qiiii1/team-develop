 document.getElementById('account-form').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;aiStatus.textContent='正在保存…';try{const settings=settingsBody();if(settings.apiKey||apiKey.placeholder.startsWith('已保存')){const response=await fetch('/api/ai-settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(settings)});const result=await response.json();if(!response.ok)throw new Error(result.error);apiKey.value='';apiKey.placeholder='已保存，留空保留原密钥';}const data=JSON.parse(localStorage.getItem('ok-ah.account.v1')||'{}');for(const field of ['name','model','endpoint'])data[field]=document.getElementById('account-'+field).value.trim();data.onboardingComplete=true;localStorage.setItem('ok-ah.account.v1',JSON.stringify(data));document.querySelector('.profile strong').textContent=data.name;aiStatus.textContent=settings.apiKey?'已保存，资料提取将使用DeepSeek':'已保存';}catch(e){aiStatus.textContent=e.message||'保存失败，请重试';}finally{button.disabled=false;}};})();</script><script data-account-avatars>(()=>{
 const characters=[{"id": "ip-1", "src": "assets/media/a70f0f8e7edc213d5193.png", "label": "魔法帽"}, {"id": "ip-2", "src": "assets/media/eb17002bd6f9294f6f2d.png", "label": "电脑"}, {"id": "ip-3", "src": "assets/media/d1124d85e5834a0dcd1a.png", "label": "喇叭"}, {"id": "ip-4", "src": "assets/media/6ac396af9fb965bbabca.png", "label": "资料夹"}, {"id": "ip-5", "src": "assets/media/8ef2961c9f4238bc6f15.png", "label": "玫瑰"}, {"id": "ip-6", "src": "assets/media/4b837f9b34f20f5ea341.png", "label": "睡觉"}, {"id": "ip-7", "src": "assets/media/2bea2f7ca7ddf36a08a1.png", "label": "灵感灯泡"}, {"id": "ip-8", "src": "assets/media/0116221451688d4a7dce.png", "label": "牛仔帽"}, {"id": "ip-9", "src": "assets/media/555f2985b503c93c9927.png", "label": "出发"}],key='ok-ah.account.v1';
 const read=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
 function renderAvatar(){const data=read(),character=characters.find(item=>item.id===data.avatarId);document.querySelectorAll('.profile-placeholder').forEach(slot=>{slot.replaceChildren();slot.classList.toggle('has-ip-avatar',!!character);if(character){const img=document.createElement('img');img.src=character.src;img.alt=data.name?data.name+'的头像':'用户头像';slot.append(img);}});if(data.name)document.querySelectorAll('.profile strong').forEach(name=>name.textContent=data.name);}
 renderAvatar();addEventListener('pageshow',renderAvatar);addEventListener('storage',e=>{if(e.key===key)renderAvatar();});
 const picker=document.querySelector('.character-picker');if(!picker)return;
 let index=Math.max(0,characters.findIndex(item=>item.id===read().avatarId));
 const preview=picker.querySelector('.account-character'),arrows=picker.querySelectorAll('.character-arrow');
 function showCharacter(){preview.src=characters[index].src;preview.alt=characters[index].label+' IP人物形象';picker.setAttribute('aria-label','人物形象：'+characters[index].label);}
 arrows.forEach((arrow,i)=>{arrow.disabled=false;arrow.addEventListener('click',()=>{index=(index+(i===0?-1:1)+characters.length)%characters.length;showCharacter();});});
 showCharacter();document.getElementById('account-form').addEventListener('submit',()=>{try{const data=read();data.avatarId=characters[index].id;localStorage.setItem(key,JSON.stringify(data));renderAvatar();}catch{document.querySelector('.save-status').textContent='保存失败，请检查浏览器存储空间';}});
})();</script></body></html>
