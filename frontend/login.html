<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · OK啊</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f6f8f0;color:#20251d;font:16px/1.6 "Microsoft YaHei",sans-serif}.login-shell{width:min(960px,calc(100vw - 40px));display:grid;grid-template-columns:1fr 1fr;overflow:hidden;border:1px solid #e0e5d5;border-radius:28px;background:#fff}.login-story{padding:56px 40px;background:#edf2df;display:flex;flex-direction:column;justify-content:center}.login-story img{width:100%;height:230px;object-fit:contain}.login-story h1{font-size:32px;line-height:1.4}.login-card{padding:48px 40px}.login-card h2{font-size:26px;margin:0 0 24px}.tabs{display:flex;gap:8px;margin-bottom:24px}.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:#f0f2ec;font:inherit;cursor:pointer}.tabs button.active{background:#dfff73}form{display:grid;gap:18px}label{display:grid;gap:6px;font-size:14px}input{padding:12px 14px;border:1px solid #dbe1d0;border-radius:10px;font:inherit;min-width:0}input:focus-visible{outline:3px solid #c4de7d}form button{padding:12px;border:0;border-radius:10px;background:#dfff73;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#error{color:#a44336;min-height:24px;font-size:14px;margin:0}.hint{color:#7a856a;font-size:13px}#join-note{color:#596b3b}@media(max-width:680px){.login-shell{grid-template-columns:1fr}.login-story{display:none}.login-card{padding:32px 24px}}
</style><script defer src="/login.js"></script></head><body><main class="login-shell"><section class="login-story"><img src="/assets/media/a70f0f8e7edc213d5193.png" alt="OK啊队友"><h1>和队友，在同一个空间工作。</h1><p>每人独立身份，连接自己的 AI。</p></section><section class="login-card"><h2 id="heading">欢迎回来</h2><p id="join-note" hidden>登录后可加入队友邀请的团队。</p><nav class="tabs" aria-label="账号入口"><button class="active" data-mode="login">登录</button><button data-mode="register">注册账号</button></nav><form id="login-form"><label id="name-field" hidden>显示姓名<input name="displayName" maxlength="40" autocomplete="name"></label><label>登录名<input name="username" required minlength="3" maxlength="32" pattern="[A-Za-z0-9_.-]+" autocomplete="username" autocapitalize="none"></label><label>密码<input name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="至少 8 位"></label><p id="error" role="alert"></p><button type="submit" id="submit">登录</button></form><p class="hint">使用部署在这台电脑上的团队账号。</p></section></main></body></html>
