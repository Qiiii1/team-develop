<script>
/* Responsive camera keeps the desktop 12-column composition, with readable labels on narrow screens. */
(function () {
  const viewport = document.querySelector('.viewport');
  const stage = document.querySelector('.stage');
  const entries = [...document.querySelectorAll('[data-destination]')];
  let queued = false;
  function fit() {
    queued = false;
    const width = viewport.clientWidth;
    const height = viewport.clientHeight;
    let box, padding, topReserve, bottomReserve;
    if (width >= 1600) {
      box = { x: 0, y: 0, width: 1920, height: 1080 };
      padding = 0; topReserve = 0; bottomReserve = 0;
    } else if (width >= 720) {
      box = { x: 300, y: 170, width: 1320, height: 840 };
      padding = 32; topReserve = 72; bottomReserve = 24;
    } else {
      box = { x: 300, y: 300, width: 1320, height: 710 };
      padding = 14; topReserve = 88; bottomReserve = 24;
    }
    const availableWidth = width - padding * 2;
    const availableHeight = height - topReserve - bottomReserve;
    const scale = Math.max(0.12, Math.min(availableWidth / box.width, availableHeight / box.height, 1.5));
    const left = (width - box.width * scale) / 2 - box.x * scale;
    const top = topReserve + Math.max(0, (availableHeight - box.height * scale) / 2) - box.y * scale;
    stage.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + scale + ')';
    stage.style.left = '0'; stage.style.top = '0';
    stage.style.setProperty('--scene-scale', scale);
    stage.style.setProperty('--caption-offset', Math.max(52, 32 / scale) + 'px');
    stage.style.setProperty('--label-size', Math.max(width < 720 ? 12 : 15, Math.min(20, 20 * scale)) + 'px');
    stage.style.setProperty('--recent-size', Math.max(11, Math.min(14, 14 * scale)) + 'px');
    stage.style.setProperty('--hover-lift', Math.min(84, 24 / scale) + 'px');
    viewport.dataset.layout = width >= 1600 ? 'wide' : width >= 720 ? 'desktop' : 'compact';
  }
  function scheduleFit() { if (!queued) { queued = true; requestAnimationFrame(fit); } }
  new ResizeObserver(scheduleFit).observe(viewport);
  window.visualViewport?.addEventListener('resize', scheduleFit);
  window.addEventListener('resize', scheduleFit);
  fit();
  entries.forEach(button => button.addEventListener('click', () => {
    entries.forEach(entry => entry.setAttribute('aria-pressed', String(entry === button)));
    document.dispatchEvent(new CustomEvent('ok-ah:navigate', { detail: { destination: button.dataset.destination } }));
  }));
  if (new URLSearchParams(location.search).get('grid') === '1') document.documentElement.dataset.grid = 'true';
})();
</script>

<script>
/* Local HTML interactions for the two Figma overlays. Business routes may subscribe to ok-ah:open-project. */
(function () {
 const assets={"search-handle":"assets/media/b177e108f12d5c6b1b47.svg","close":"assets/media/6f6f5709eddc985c7264.svg","folder-active":"assets/media/07864348970b46d37b08.svg","divider":"assets/media/d522aa0ce9c5fc3cf985.svg","search-ring":"assets/media/7ac99cc7bf90469d9711.svg","folder":"assets/media/15538bf1a43d5d76af78.svg","arrow":"assets/media/d6edea22daef067e6cbd.svg"};
 const seed=[];
 const key='ok-ah.local-projects.v1',selectionKey='ok-ah.current-project.v1';
 let saved=[],current='team-management';
 try {
  const data=JSON.parse(localStorage.getItem(key)||'[]');
  if(Array.isArray(data))saved=data.filter(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&p.name.trim()).map(p=>({id:p.id,name:p.name.slice(0,80),meta:typeof p.meta==='string'?p.meta.slice(0,120):'刚刚创建'}));
  current=localStorage.getItem(selectionKey)||current;
 } catch {}
 let projects=[...saved,...seed];
 if(!projects.some(p=>p.id===current))current='team-management';
 const history=document.getElementById('history-dialog'),create=document.getElementById('create-dialog');
 const search=document.getElementById('history-search'),list=document.getElementById('history-list'),count=document.getElementById('history-count');
 const form=document.getElementById('create-project-form'),nameInput=document.getElementById('project-name');
 let trigger=null,previousOverflow='';
 function image(name){const img=document.createElement('img');img.src=assets[name];img.alt='';return img;}
 function slot(className,name){const span=document.createElement('span');span.className=className;span.setAttribute('aria-hidden','true');span.append(image(name));return span;}
 function renderHistory(){
  const query=search.value.trim().toLocaleLowerCase();
  const filtered=projects.filter(p=>p.name.toLocaleLowerCase().includes(query));
  count.textContent='共'+filtered.length+'个项目';list.replaceChildren();
  if(!filtered.length){const li=document.createElement('li');li.className='history-empty';li.textContent='没有找到匹配的项目';list.append(li);return;}
  filtered.forEach((project,index)=>{
   const li=document.createElement('li'),button=document.createElement('button');
   button.type='button';button.className='history-row';button.dataset.projectId=project.id;
   if(project.id===current)button.setAttribute('aria-current','true');
   button.append(slot('folder-slot',project.id===current?'folder-active':'folder'));
   const copy=document.createElement('span');copy.className='project-row-copy';
   const title=document.createElement('span');title.className='project-row-title';title.textContent=project.name;
   const meta=document.createElement('span');meta.className='project-row-meta';meta.textContent=project.meta;
   copy.append(title,meta);button.append(copy,slot('arrow-slot','arrow'));
   button.addEventListener('click',()=>selectProject(project));li.append(button);
   if(index<filtered.length-1){const divider=document.createElement('span');divider.className='project-divider';divider.setAttribute('aria-hidden','true');divider.append(image('divider'));li.append(divider);}
   list.append(li);
  });
 }
 function closeDialog(dialog){
  if(!dialog.open||dialog.classList.contains('is-closing'))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){dialog.close();return;}
  dialog.classList.add('is-closing');
  const finish=()=>{clearTimeout(dialog.closeTimer);dialog.removeEventListener('animationend',onEnd);if(dialog.open)dialog.close();dialog.classList.remove('is-closing');};
  const onEnd=event=>{if(event.target===dialog&&event.animationName==='dialog-exit')finish();};
  dialog.addEventListener('animationend',onEnd);
  dialog.closeTimer=setTimeout(finish,230);
 }
 function show(dialog,source){
  if(history.open)history.close();if(create.open)create.close();
  trigger=source||document.activeElement;
  dialog.sceneTrigger=trigger;
  trigger?.classList.remove('just-closed');trigger?.classList.add('is-dialog-open');
  previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
  if(dialog===history){search.value='';renderHistory();}
  else{form.reset();nameInput.setCustomValidity('');}
  clearTimeout(dialog.closeTimer);dialog.classList.remove('is-closing');
  dialog.showModal();
  requestAnimationFrame(()=>{if(dialog.open)(dialog===history?search:nameInput).focus();});
 }
 function selectProject(project){
  current=project.id;
  try{localStorage.setItem(selectionKey,current);}catch{}
  const label=document.querySelector('.project .label');label.textContent=project.name;
  document.querySelector('.project').setAttribute('aria-label',project.name);
  closeDialog(history);
  document.dispatchEvent(new CustomEvent('ok-ah:open-project',{detail:{id:project.id,name:project.name,storage:'local'}}));
 }
 for(const dialog of [history,create]){
  dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog(dialog);});
  dialog.addEventListener('keydown',event=>{if(event.key==='Tab'){
    const focusables=[...dialog.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter(n=>n.tabIndex>=0&&n.getClientRects().length);
    const first=focusables[0],last=focusables[focusables.length-1];
    if(!first){event.preventDefault();return;}
    if(event.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){event.preventDefault();first.focus();}
   } if(event.key==='Escape'){event.preventDefault();event.stopPropagation();closeDialog(dialog);}},true);
  dialog.querySelectorAll('[data-close-dialog]').forEach(b=>b.addEventListener('click',()=>closeDialog(dialog)));
  dialog.addEventListener('click',event=>{
   if(event.target!==dialog)return;
   const r=dialog.getBoundingClientRect();
   if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog(dialog);
  });
  dialog.addEventListener('close',()=>{
   const entry=dialog.sceneTrigger;
   entry?.classList.remove('is-dialog-open');entry?.classList.add('just-closed');
   dialog.sceneTrigger=null;
   document.body.style.overflow=previousOverflow;
   const target=trigger;trigger=null;target?.focus();
  });
 }
 document.querySelectorAll('.scene-entry').forEach(entry=>{
  for(const event of ['pointerleave','pointerenter','blur'])entry.addEventListener(event,()=>entry.classList.remove('just-closed'));
 });
 search.addEventListener('input',renderHistory);
 nameInput.addEventListener('input',()=>nameInput.setCustomValidity(''));
 form.addEventListener('submit',async event=>{
  event.preventDefault();const name=nameInput.value.trim();
  if(!name){nameInput.setCustomValidity('请输入项目名称');nameInput.reportValidity();return;}
  const button=form.querySelector('[type=submit]');if(button?.disabled)return;if(button)button.disabled=true;
  try{const project=await window.TeamBackend.createTeam(name);
  saved=[project,...saved];projects=[...saved,...seed];
  localStorage.setItem(key,JSON.stringify(saved));
  closeDialog(create);selectProject(project);
  }catch(error){nameInput.setCustomValidity(error.message);nameInput.reportValidity();}
  finally{if(button)button.disabled=false;}
 });
 document.addEventListener('ok-ah:navigate',event=>{
  const destination=event.detail?.destination;
  if(destination==='history')show(history,document.querySelector('.history'));
  if(destination==='create')show(create,document.querySelector('.create'));
 });
 function enterProject(project){
  const url=new URL('project.html',location.href);url.searchParams.set('project',project.id);
  const wait=matchMedia('(prefers-reduced-motion: reduce)').matches?0:240;
  setTimeout(()=>location.assign(url.href),wait);
 }
 document.addEventListener('ok-ah:open-project',event=>enterProject(event.detail));
 document.addEventListener('ok-ah:navigate',event=>{if(event.detail?.destination==='project'){const project=projects.find(p=>p.id===current)||projects[0];if(project)enterProject(project);else show(create,document.querySelector('.create'));}});
 if(!projects.length)document.querySelector('.project .label').textContent='创建第一个团队';
 const selected=projects.find(p=>p.id===current);
 if(selected&&current!=='team-management'){document.querySelector('.project .label').textContent=selected.name;document.querySelector('.project').setAttribute('aria-label',selected.name);}
})();
</script>
