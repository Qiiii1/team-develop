(()=>{

 const viewport=document.querySelector('.viewport'),canvas=document.querySelector('.app');
 function fitScene(){

 }
 new ResizeObserver(fitBoard).observe(document.querySelector('.blackboard'));

  if(!img||!img.naturalWidth)return;
  const slot=img.parentElement;
  const left=Number(img.dataset.bodyLeft),right=Number(img.dataset.bodyRight),top=Number(img.dataset.bodyTop),bottom=Number(img.dataset.bodyBottom);
