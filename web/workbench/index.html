<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OK啊 · 工作台任务</title><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="workbench-overrides.css"><link rel="stylesheet" href="workbench-ui-kit.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark"><img src="assets/ok-a-icon.png" alt=""></span><div><strong>OK啊</strong><small>OK AH</small></div></div><nav class="nav" aria-label="主导航"><a class="active" href="index.html"><span>▤</span>工作台</a><a href="#" data-placeholder="黑板"><span>▣</span>黑板</a><a href="#" data-placeholder="知识库"><span>▥</span>知识库</a><a href="../index.html"><span>✧</span>个人 AI</a></nav><div class="side-bottom"><button class="project" id="project-manage">小组管理项目 <span>⇥</span></button><div class="account"><span class="avatar">枝</span><div><b>枝吱</b><small>ID：22599qq</small></div></div></div></aside>
<main class="main"><header class="topbar"><div><h1>项目工作台</h1><p>小组管理项目 · 把每一阶段的任务推进到完成</p></div><div class="top-actions"><button class="button" id="invite">邀请</button><button class="button" id="report">＋ 举手</button></div></header>
<div class="content"><div class="tabs"><div class="tab-left"><button class="selected" data-view="tasks">任务</button><button data-view="time">时间</button><button data-view="people">分工</button></div><div class="tab-right"><button id="scope">当前阶段任务</button><button id="filter-open" aria-expanded="false">筛选</button><div class="search-slot"><input id="inline-search" type="search" placeholder="搜索任务名称" aria-label="搜索任务名称" hidden><button id="search-open" aria-expanded="false">搜索</button></div></div><div class="filter-popover" id="filter-popover" hidden><div class="popover-head"><h2>筛选任务</h2><button id="filter-reset">重置</button></div><label class="field">负责人<select id="filter-owner"><option value="">全部成员</option><option>枝吱</option><option>鲤鱼</option><option>蚂蚁</option><option>背带</option><option>骑驴</option></select></label><label class="field">截止时间<select id="filter-due"><option value="">全部时间</option><option value="today">今天及以前</option><option value="week">未来 7 天</option><option value="none">未设置</option></select></label><label class="check-row"><input type="checkbox" id="filter-blocked">只看阻塞任务</label><label class="check-row"><input type="checkbox" id="filter-mine">只看与我相关</label><button class="button dark apply-filter" id="filter-apply">应用筛选</button></div></div>
<section class="stage-wrap"><button class="stage-arrow" id="prev-stage" aria-label="上一阶段">‹</button><div class="stage-card"><div><span class="eyebrow" id="stage-index"></span><button class="stage-name" id="stage-name"></button><span class="stage-status" id="stage-status"></span></div><div><span class="eyebrow">阶段进度</span><div class="progress-line"><strong id="stage-percent"></strong><div class="bar"><i id="stage-bar"></i></div></div><small id="stage-count"></small></div><div><span class="eyebrow">阶段日期</span><strong class="stage-date" id="stage-date"></strong><small id="stage-attention"></small></div><div><span class="eyebrow">需要关注</span><div class="attention-values"><strong id="stage-risk"></strong><strong id="stage-review"></strong></div></div><div class="stage-actions"><button class="button small" id="add-stage">＋ 新建阶段</button><button class="button small" id="end-stage">结束阶段</button></div></div><button class="stage-arrow" id="next-stage" aria-label="下一阶段">›</button></section>
<div class="notice-row"><div class="notice"><span class="notice-icon">✦</span><span id="notice-text">总 AI 可分析延期影响，所有调整由成员确认。</span><button id="impact-open">查看影响 →</button></div><button class="button notice-new-task" id="new-task">＋ 新建任务</button></div><div class="board-head"><div><h2 id="view-title">阶段任务</h2><p id="view-subtitle">任务状态由成员更新</p></div><button class="button" id="inline-new" hidden>＋ 新建任务</button></div><section id="view-content" class="board"></section></div></main></div>
<div class="overlay" id="overlay"><div class="dialog" id="dialog" role="dialog" aria-modal="true"></div></div><div class="drawer-backdrop" id="drawer-backdrop"><aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside></div><div class="toast" id="toast"></div><script src="workbench.js"></script><script src="workbench-refinements.js"></script><script src="workbench-ai-panel.js"></script><script src="workbench-project-menu.js"></script><script src="workbench-time.js"></script><script src="workbench-gantt.js"></script><script src="workbench-people.js"></script><script src="workbench-scope-summary.js"></script></body></html>
